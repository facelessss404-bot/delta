# Render.com Blueprint — Delta Squad Foundation
# Deploy: Connect this repo on https://dashboard.render.com → New → Blueprint
# Or create a Web Service manually with these settings.

services:
  - type: web
    name: delta-squad
    runtime: node
    region: singapore          # Closest to Supabase AP-Southeast-2
    plan: free                 # Free tier (750 hrs/mo)
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"         # Render default
      - key: DATABASE_URL
        sync: false            # Set in dashboard (contains password)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_NOTES_BUCKET
        value: training-notes
      - key: SUPABASE_VIDEOS_BUCKET
        value: physical-videos
      - key: DB_POOL_MAX
        value: "4"
      - key: JWT_SECRET
        generateValue: true    # Render auto-generates a secure secret
      - key: FRONTEND_ORIGIN
        sync: false            # Set to your Render URL, e.g. https://delta-squad.onrender.com
