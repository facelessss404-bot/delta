# Render.com Blueprint — Delta Squad Foundation (Backend API)
# Frontend is deployed separately on Netlify.
# Deploy: Connect this repo on https://dashboard.render.com → New → Blueprint

services:
  - type: web
    name: delta-squad
    runtime: node
    region: singapore          # Closest to Supabase AP-Southeast-2
    plan: free                 # Free tier (750 hrs/mo)
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"         # Render default
      - key: DATABASE_URL
        sync: false            # Set in dashboard (contains password)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_NOTES_BUCKET
        value: training-notes
      - key: SUPABASE_VIDEOS_BUCKET
        value: physical-videos
      - key: DB_POOL_MAX
        value: "5"
      - key: JWT_SECRET
        generateValue: true    # Render auto-generates a secure secret
      - key: FRONTEND_ORIGIN
        sync: false            # Set to your Netlify URL, e.g. https://delta-squad.netlify.app
      - key: RENDER_EXTERNAL_URL
        sync: false            # Set to https://delta-squad.onrender.com (for keep-alive pings)

